<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#4d2868" />
<title>Viola Café | Digital Menu</title>
<style>
:root{
  --violet:#4d2868;--violet2:#6f3f8c;--lav:#efe7f5;--green:#92aa3c;--ink:#211a25;
  --muted:#756c79;--bg:#f8f5fa;--card:#ffffff;--line:#eadfed;--shadow:0 12px 30px rgba(63,32,82,.10)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fbf9fc 0%,#f7f2fa 100%);color:var(--ink)}
a{color:inherit}.shell{max-width:860px;margin:0 auto;padding-bottom:110px}
.hero{margin:0 0 12px;background:radial-gradient(circle at 80% 12%,rgba(146,170,60,.23),transparent 32%),linear-gradient(145deg,#4d2868 0%,#6f3f8c 62%,#8c5ba5 100%);color:#fff;border-radius:0 0 34px 34px;padding:22px 18px 24px;box-shadow:0 18px 38px rgba(77,40,104,.18)}
.top{display:flex;align-items:center;gap:14px}.logoBox{width:86px;height:86px;border-radius:24px;background:#fff;display:grid;place-items:center;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.12)}.logoBox img{width:100%;height:100%;object-fit:contain;border-radius:18px}.brand h1{font-size:28px;line-height:1;margin:0 0 6px;letter-spacing:.2px}.brand p{margin:0;color:#eee4f4;font-size:14px}.badgeRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{font-size:12px;font-weight:700;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px)}
.searchWrap{margin-top:18px;position:relative}.searchWrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:19px}.search{width:100%;border:0;outline:0;border-radius:18px;padding:15px 16px 15px 48px;font-size:16px;background:#fff;color:#251c2b;box-shadow:0 8px 22px rgba(0,0,0,.10)}
.intro{padding:14px 16px 4px}.introCard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:14px}.introTitle{font-weight:800;color:var(--violet);font-size:16px}.introText{font-size:13px;color:var(--muted);margin-top:3px}.pill{background:var(--lav);color:var(--violet);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;white-space:nowrap}
.catsWrap{position:sticky;top:0;z-index:20;background:rgba(248,245,250,.92);backdrop-filter:blur(12px);padding:10px 0;border-bottom:1px solid rgba(234,223,237,.75)}.cats{display:flex;gap:9px;overflow-x:auto;padding:0 16px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cats button{border:1px solid var(--line);background:#fff;color:#564d5a;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:750;white-space:nowrap;box-shadow:0 4px 12px rgba(49,28,61,.05)}.cats button.active{background:var(--violet);border-color:var(--violet);color:#fff}
.wrap{padding:4px 16px}.section{margin:24px 0 30px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:11px}.section h2{margin:0;color:var(--violet);font-size:23px}.count{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr;gap:10px}.item{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:11px;box-shadow:0 7px 20px rgba(54,29,68,.06);transition:.15s transform,.15s box-shadow}.item:active{transform:scale(.99)}.thumb{width:72px;height:72px;border-radius:16px;background:linear-gradient(145deg,#f1e9f5,#faf7fc);display:grid;place-items:center;color:#9f87ab;font-size:24px;border:1px dashed #d8c8df;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.name{font-weight:800;font-size:15px;line-height:1.25}.note{font-size:11px;color:#9a909e;margin-top:5px}.price{font-weight:900;color:var(--violet);white-space:nowrap;font-size:15px;text-align:right}.currency{font-size:10px;color:#9b8fa1;display:block;margin-top:2px;font-weight:700}.empty{padding:46px 18px;text-align:center;color:var(--muted)}
.actions{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(828px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:30}.action{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:18px;padding:14px 12px;font-weight:850;box-shadow:0 12px 26px rgba(55,30,70,.17);border:1px solid rgba(255,255,255,.2)}.action.primary{background:var(--violet);color:#fff}.action.secondary{background:#fff;color:var(--violet);border-color:var(--line)}
.footer{text-align:center;color:#8e838f;padding:14px 18px 30px;font-size:12px}.footer strong{color:var(--violet)}
@media(min-width:700px){.hero{margin-top:16px;border-radius:32px}.grid{grid-template-columns:1fr 1fr}.item{grid-template-columns:72px 1fr auto}.brand h1{font-size:34px}}
.adminLink{position:fixed;right:14px;top:14px;z-index:45;background:rgba(255,255,255,.94);color:var(--violet);text-decoration:none;font-size:12px;font-weight:850;padding:9px 12px;border-radius:999px;border:1px solid var(--line);box-shadow:0 8px 20px rgba(55,30,70,.10)}
</style>
</head>
<body>
<a class="adminLink" href="/admin/">⚙ Admin</a>
<div class="shell">
  <header class="hero">
    <div class="top">
      <div class="logoBox"><img src="assets/logo.jpeg" alt="Viola Café logo"></div>
      <div class="brand"><h1 id="cafeName">Viola Café</h1><p><span id="city">Jigjiga</span> • <span id="subtitle">Digital Menu</span></p></div>
    </div>
    <div class="badgeRow" id="badgeRow"></div>
    <div class="searchWrap"><span>⌕</span><input class="search" id="search" placeholder="Search coffee, pizza, juice…" autocomplete="off"></div>
  </header>

  <div class="intro"><div class="introCard"><div><div class="introTitle" id="introTitle"></div><div class="introText" id="introText"></div></div><div class="pill"><span id="currencyPill">ETB</span> Prices</div></div></div>

  <div class="catsWrap"><div class="cats" id="cats"></div></div>
  <main class="wrap" id="menu"></main>
  <div class="footer"><strong id="footerCafe">VIOLA CAFÉ</strong><br><span id="footerText"></span></div>
</div>

<div class="actions">
  <a class="action primary" id="whatsappBtn" target="_blank" rel="noopener">💬 WhatsApp</a>
  <a class="action secondary" id="phoneBtn">☎ Call Viola</a>
</div>

<script>
let menuData={categories:[]}, settings={};
const menu=document.getElementById('menu'),cats=document.getElementById('cats'),search=document.getElementById('search');
let current='All';
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function applySettings(){
 document.getElementById('cafeName').textContent=settings.cafe_name||'Viola Café';
 document.getElementById('city').textContent=settings.city||'Jigjiga'; document.getElementById('subtitle').textContent=settings.subtitle||'Digital Menu';
 document.getElementById('introTitle').textContent=settings.intro_title||'Choose what you love'; document.getElementById('introText').textContent=settings.intro_text||'';
 document.getElementById('currencyPill').textContent=settings.currency||'ETB'; document.getElementById('footerCafe').textContent=(settings.cafe_name||'Viola Café').toUpperCase(); document.getElementById('footerText').textContent=settings.footer||'';
 const br=document.getElementById('badgeRow'); br.innerHTML=(settings.badges||[]).map(x=>`<span class="badge">${esc(x)}</span>`).join('');
 const msg=encodeURIComponent(settings.whatsapp_message||'Hello Viola Cafe'); document.getElementById('whatsappBtn').href=`https://wa.me/${(settings.whatsapp||'').replace(/\D/g,'')}?text=${msg}`;
 document.getElementById('phoneBtn').href=`tel:+${(settings.phone||'').replace(/\D/g,'')}`;
}
function renderCats(){cats.innerHTML=''; ['All',...(menuData.categories||[]).map(c=>c.name)].forEach((c,i)=>{const b=document.createElement('button');b.textContent=c;b.className=(c===current)?'active':'';b.onclick=()=>{current=c;renderCats();render();window.scrollTo({top:document.querySelector('.catsWrap').offsetTop,behavior:'smooth'})};cats.appendChild(b)})}
function render(){const q=search.value.trim().toLowerCase();menu.innerHTML='';let total=0;(menuData.categories||[]).forEach(cat=>{if(current!=='All'&&cat.name!==current)return;const arr=(cat.items||[]).filter(it=>(it.name||'').toLowerCase().includes(q)||cat.name.toLowerCase().includes(q));if(!arr.length)return;total+=arr.length;const sec=document.createElement('section');sec.className='section';sec.innerHTML=`<div class="sectionHead"><h2>${esc(cat.name)}</h2><span class="count">${arr.length} items</span></div><div class="grid">${arr.map(it=>{const photo=it.photo?`<img src="${esc(it.photo)}" alt="${esc(it.name)}">`:esc(cat.emoji||'✦'); const badge=it.badge?`<div class="note">${esc(it.badge)}</div>`:`<div class="note">${esc(it.note||'')}</div>`;return `<article class="item"><div class="thumb">${photo}</div><div><div class="name">${esc(it.name)}</div>${badge}</div><div class="price">${esc(it.price)}<span class="currency">${esc(settings.currency||'ETB')}</span></div></article>`}).join('')}</div>`;menu.appendChild(sec)});if(!total)menu.innerHTML='<div class="empty">No menu item found. Try another search.</div>'}
search.addEventListener('input',()=>{current='All';renderCats();render()});
Promise.all([fetch('/content/menu.json',{cache:'no-store'}).then(r=>r.json()),fetch('/content/settings.json',{cache:'no-store'}).then(r=>r.json())]).then(([m,s])=>{menuData=m;settings=s;applySettings();renderCats();render()}).catch(e=>{menu.innerHTML='<div class="empty">Menu is temporarily unavailable.</div>';console.error(e)});
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>if(window.netlifyIdentity){window.netlifyIdentity.on('init',u=>{if(!u && window.location.hash.includes('invite_token')) window.netlifyIdentity.open('signup');});}</script>
</body>
</html>
